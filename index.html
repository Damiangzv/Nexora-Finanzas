<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nexora Finanzas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--navy:#0B2A5B;--mid:#1E5BB8;--light:#6FB1F0;--green:#22C55E;--red:#FF7A85;--txt:#fff;--glass:rgba(20,70,150,.45);--line:rgba(255,255,255,.18)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);background:linear-gradient(180deg,#cfe6fb 0%,#5a9be0 22%,#1c4a96 55%,#0B2A5B 100%) fixed}
#app{max-width:430px;margin:0 auto;padding:14px 16px 110px;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:600;color:#0B2A5B}
.logo i{display:block;width:26px;height:18px;background:linear-gradient(#0B2A5B 0 28%,transparent 28% 36%,#0B2A5B 36% 64%,transparent 64% 72%,#0B2A5B 72%)}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.7);color:#0B2A5B;font-size:17px}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(5,25,70,.3)}
.dark{background:rgba(9,38,92,.88)}
.lbl{opacity:.8;font-size:15px}
.big{font-size:40px;font-weight:700;margin:6px 0 10px;letter-spacing:-1px}.big small{font-size:40px;opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.1);font-size:13px}
.pos{color:var(--green)}.neg{color:var(--red)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.act{padding:14px 4px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.12);color:#fff;font-size:14px;transition:transform .15s}
.act:active,.nb:active{transform:scale(.94)}.act b{display:block;font-size:20px;margin-bottom:2px}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.sec span{font-size:13px;opacity:.75}
.row{display:flex;align-items:center;gap:12px;padding:9px 0}
.av{width:44px;height:44px;border-radius:50%;background:var(--mid);display:grid;place-items:center;font-weight:600;flex:none}
.row .n{flex:1;min-width:0}.row .n b{display:block;font-size:14px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .n small{opacity:.65;font-size:12px}
.row .a{text-align:right;font-weight:600}.row .a small{display:block;font-size:12px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:140px;background:repeating-linear-gradient(transparent 0 34px,rgba(255,255,255,.18) 34px 35px);padding:0 4px}
.bar{width:30px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar div{transition:height .6s}.bl{display:flex;justify-content:space-between;font-size:11px;opacity:.7;padding:6px 4px 0}.bl span{width:30px;text-align:center}
.donut{display:block;margin:0 auto;width:250px;height:250px}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:14px}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{flex:1;padding:10px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:14px}.tab.on{background:var(--light);color:#0B2A5B;font-weight:600}
.dc{background:var(--light);color:#0B2A5B;border-radius:26px;margin-bottom:12px;overflow:hidden}
.dc .t{display:flex;justify-content:space-between;padding:12px 18px 0;font-size:13px}.dc h3{margin:8px 18px 8px;font-size:19px}
.dc .chip{background:rgba(255,255,255,.4);border-color:transparent;color:#0B2A5B}.dc .chips{padding:0 18px}
.dc .f{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;margin-top:12px;border-top:1px solid rgba(11,42,91,.2);font-size:14px}
.dc button{border:0;border-radius:12px;padding:6px 12px;background:#0B2A5B;color:#fff;font-size:12px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(398px,calc(100% - 32px));display:flex;background:rgba(7,30,76,.95);border-radius:26px;padding:10px 6px;border:1px solid var(--line);z-index:5}
.nb{flex:1;border:0;background:none;color:#fff;opacity:.55;font-size:12px;padding:4px}.nb b{display:block;font-size:19px;font-weight:400}.nb.on{opacity:1}
.prog{height:14px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden;margin:12px 0}.prog div{height:100%;background:linear-gradient(90deg,var(--light),var(--green));transition:width .6s}
.modal{position:fixed;inset:0;background:rgba(3,15,45,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}
.sheet{width:100%;max-width:430px;background:#0d2f6b;border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:in .3s}
input,select{width:100%;margin:6px 0;padding:13px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:16px;font-family:inherit}
select option{color:#000}input::placeholder{color:rgba(255,255,255,.5)}
.go{width:100%;padding:14px;border:0;border-radius:16px;background:var(--light);color:#0B2A5B;font-weight:700;font-size:16px;margin-top:8px}
.err{color:var(--red);font-size:13px;min-height:16px}
.ins{border-left:4px solid var(--light);background:rgba(255,255,255,.08);border-radius:16px;padding:12px 14px;margin-bottom:10px}.ins b{font-size:15px}.ins p{margin:4px 0 0;font-size:13px;opacity:.8;line-height:1.45}.ins.h{border-color:var(--red)}.ins.m{border-color:#F5C451}.ins.l{border-color:var(--green)}
.hint{color:var(--light);font-size:13px;min-height:16px}
textarea{width:100%;min-height:130px;margin:10px 0 0;padding:13px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:16px;font-family:inherit;resize:vertical}
.go.alt{background:rgba(255,255,255,.14);color:#fff}.go:disabled{opacity:.4}
.mini{width:auto;margin:0;padding:6px 8px;font-size:12px;background:rgba(255,255,255,.55);color:#0B2A5B;border:0;border-radius:10px}
.tgt{display:flex;justify-content:space-between;font-size:14px;margin-top:10px}
.nb b{display:flex;justify-content:center;margin-bottom:3px}.act b{display:flex;justify-content:center;margin-bottom:6px}
.ib{display:grid;place-items:center;font-weight:600;font-size:16px}
.dc .f{flex-wrap:wrap;gap:8px}
.link,.bar,.donut circle,.ins{cursor:pointer}.link:active{opacity:.7}.crumb{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;opacity:.95}.crumb button{border:1px solid var(--line);background:rgba(255,255,255,.15);color:#fff;border-radius:14px;padding:7px 12px;flex:none}.crumb span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#auth{position:fixed;inset:0;z-index:20;overflow:auto;display:none;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#cfe6fb 0%,#5a9be0 22%,#1c4a96 55%,#0B2A5B 100%)}#auth .card{width:100%;max-width:400px;margin:0}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin:10px 0}.chk input{width:auto;margin:0}
.nb{font-size:11px}.nav{padding:10px 2px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<div id="auth"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
// ===== Estado y memoria (se guarda en este navegador) =====
const today=new Date(),TD=today.toISOString().slice(0,10),cur=TD.slice(0,7),KEY='nexora-finanzas-v1';
let screen='home',M=[],I=[],S={goal:1500,sym:'$',name:''},id=1,hf={q:'',t:'all',m:cur},qs=[];
try{const st=JSON.parse(localStorage.getItem(KEY)||'null');if(st){M=st.M||[];I=st.I||[];Object.assign(S,st.S||{});if(st.goal)S.goal=st.goal}}catch(e){}
id=[...M,...I].reduce((x,m)=>Math.max(x,m.id),0)+1;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({M,S,I}))}catch(e){}};
const $=s=>document.querySelector(s),sum=a=>a.reduce((s,m)=>s+m.amt,0);
const f=n=>n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}),m$=n=>S.sym+f(n);
const mk=o=>{const d=new Date(today.getFullYear(),today.getMonth()-o,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mon=(k=cur)=>M.filter(m=>m.date.slice(0,7)===k);
const mname=k=>new Date(k+'-15').toLocaleDateString('es-MX',{month:'long',year:'numeric'});
const TL={in:'Ingreso',out:'Gasto',owed:'Por cobrar'},cls=m=>m.t==='in'?'pos':'neg',sgn=m=>m.t==='in'?'+':'-';
// ===== Iconos de línea =====
const P={home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',cap:'M13 2L4 14h7l-1 8 9-12h-7z',ana:'M3 17l6-6 4 4 8-8M15 7h6v6',inv:'M12 3v18M16 7H10a2.5 2.5 0 0 0 0 5h4a2.5 2.5 0 0 1 0 5H8',his:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',user:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',plus:'M12 5v14M5 12h14',down:'M7 7l10 10M17 8v9H8',swap:'M7 4l-4 4 4 4M3 8h14M17 20l4-4-4-4M21 16H7'};
const ic=(k,z=22)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${P[k]}"/></svg>`;
// ===== Reconocimiento automático de gastos =====
const CATS=['Comida','Restaurantes','Transporte','Hogar','Servicios','Salud','Educación','Ocio','Viajes','Suscripciones','Ropa','Belleza','Tecnología','Mascotas','Regalos','Familia','Seguros','Deudas','Donaciones','Otros'],NEED=['Hogar','Servicios','Comida','Transporte','Salud','Educación','Seguros','Deudas','Familia'];
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const KW={Comida:'super supermercado mercado despensa walmart soriana costco abarrotes',Restaurantes:'restaurante cena cenar comida comer almuerzo desayuno desayunar cafe pizza tacos starbucks mcdonald burger rappi sushi',Transporte:'uber didi cabify taxi gasolina metro bus camion estacionamiento caseta peaje',Hogar:'renta alquiler ferreteria muebles limpieza hipoteca mantenimiento',Servicios:'luz agua internet telefono gas cfe celular',Salud:'farmacia doctor medico dentista hospital gimnasio gym medicina consulta',Educación:'curso libro colegiatura escuela universidad udemy',Ocio:'cine concierto entradas bar fiesta videojuego salida',Viajes:'viaje hotel vuelo avion boleto airbnb',Suscripciones:'netflix spotify disney hbo prime youtube icloud suscripcion chatgpt',Ropa:'ropa zapatos tenis zara camisa pantalon',Belleza:'peluqueria barberia corte unas spa maquillaje',Tecnología:'laptop computadora audifonos software',Mascotas:'veterinario croquetas mascota perro gato',Regalos:'regalo cumpleanos flores',Familia:'guarderia panales hijos',Seguros:'seguro poliza',Deudas:'tarjeta credito prestamo deuda abono',Donaciones:'donativo donacion diezmo'};
const INC=['sueldo','salario','nomina','ingreso','freelance','venta','deposito','comision','bono','pago recibido'],AL={cenar:'Cena',comer:'Comida',desayunar:'Desayuno'};
const kwhit=d=>{const w=norm(d).split(/[^a-z0-9]+/);for(const[k,v]of Object.entries(KW)){const h=w.find(x=>v.split(' ').includes(x));if(h)return{cat:k,kw:h}}return{}};
const guess=d=>kwhit(d).cat||null;
function parse(l){ // Entiende frases: "Fui a cenar y le puse 300 pesos a Carlos" · "Invité a Carlos, 300" · "Uber 150"
 const n=l.match(/(\d[\d.,]*)/);if(!n)return null;const amt=parseFloat(n[1].replace(/,/g,''));if(!(amt>0))return null;
 const t0=norm(l),inv=/invit(e|o)|corre por mi cuenta|de mi cuenta|yo pague|yo lo pago/.test(t0);
 const owe=!inv&&/me debe|me deben|por cobrar|preste|prestado|le puse|le adelante|pague por|le pague|me tiene que|me va a (pagar|devolver)/.test(t0);
 const caps=l.match(/\b[A-ZÁÉÍÓÚÑ][a-záéíóúñ]{2,}\b/g)||[];let who=caps.find((x,i)=>!(i===0&&l.trim().startsWith(x)))||'';
 if((owe||inv)&&!who){const w=t0.match(/\b(?:a|con|debe|para)\s+([a-z]{3,})\s*$/);who=w?cap(w[1]):''}
 const t=owe?'owed':!inv&&INC.some(k=>t0.includes(k))?'in':'out',h=kwhit(l);
 let desc=l.trim().split(/\s+/).length>3&&h.kw?(AL[h.kw]||cap(h.kw)):cap(l.replace(n[0],'').replace(/pesos|[$€£]/gi,'').replace(/\s+/g,' ').trim())||'Sin descripción';
 if(inv&&who)desc+=' con '+who;if(t==='owed'&&!who)who='Sin indicar';
 const cat=t==='in'?'Ingreso':h.cat||'Otros';
 const why=t==='owed'?`${who} te debe ${m$(amt)}: tú pagaste por esa persona.`:inv?`Gasto propio: tú invitaste${who?' a '+who:''}, no se cobra.`:t==='in'?'Ingreso detectado.':`Gasto detectado en ${cat}.`;
 return{t,amt,desc,who:t==='owed'?who:'',cat,date:TD,why};
}
// ===== Cálculos =====
const cats=k=>mon(k).filter(m=>m.t==='out').reduce((o,m)=>(o[m.cat]=(o[m.cat]||0)+m.amt,o),{});
function calc(){const a=mon(),inc=sum(a.filter(m=>m.t==='in')),exp=sum(a.filter(m=>m.t==='out')),pend=sum(a.filter(m=>m.t==='owed'&&!m.paid)),sav=inc-exp-pend;
 const dayNet=M.filter(m=>m.date===TD).reduce((s,m)=>s+(m.t==='in'?m.amt:m.t==='out'||(m.t==='owed'&&!m.paid)?-m.amt:0),0);
 return{inc,exp,pend,sav,bal:sav,dayNet,pct:inc?sav/inc*100:0}}
function hist(){const o=[];for(let i=5;i>=0;i--){const a=mon(mk(i));o.push({k:mk(i),m:new Date(mk(i)+'-15').toLocaleDateString('es-MX',{month:'short'}).replace('.','').toUpperCase(),i:sum(a.filter(m=>m.t==='in')),g:sum(a.filter(m=>m.t==='out'))+sum(a.filter(m=>m.t==='owed'&&!m.paid))})}return o}
function insights(c){ // recomendaciones basadas en tus datos
 const L=[],ct=cats(cur),pt=cats(mk(1)),dim=new Date(today.getFullYear(),today.getMonth()+1,0).getDate(),dd=today.getDate();let pot=0;
 if(!mon().length)return{L:[{l:'i',t:'Aún no hay datos suficientes',d:'Registra tus movimientos para recibir recomendaciones personalizadas.'}],pot};
 if(c.inc>0){const r=c.pct;L.push(r<10?{l:'h',t:`Tasa de ahorro baja (${r.toFixed(1)}%)`,d:'Lo recomendable es ahorrar al menos el 20% de los ingresos. Prioriza reducir gastos no esenciales.'}:r<20?{l:'m',t:`Tasa de ahorro aceptable (${r.toFixed(1)}%)`,d:'Estás cerca del objetivo del 20%. Un pequeño recorte en gustos puede lograrlo.'}:{l:'l',t:`Tasa de ahorro sólida (${r.toFixed(1)}%)`,d:'Superas el 20% recomendado. Considera destinar el excedente a un fondo de emergencia o inversión.'})}
 const want=c.exp-NEED.reduce((s,k)=>s+(ct[k]||0),0);
 if(c.inc>0&&want>c.inc*.3){const x=want-c.inc*.3;pot+=x;L.push({l:'h',t:'Gastos discrecionales por encima del 30%',d:`Ocio, ropa, suscripciones y otros suman ${m$(want)} (${(want/c.inc*100).toFixed(0)}% del ingreso). Reducirlos al 30% liberaría ${m$(x)}.`})}
 const top=Object.entries(ct).sort((a,b)=>b[1]-a[1])[0];
 if(top&&top[0]!=='Hogar'&&c.exp>0&&top[1]/c.exp>.35){pot+=top[1]*.1;L.push({c:top[0],l:'m',t:`${top[0]} concentra el ${(top[1]/c.exp*100).toFixed(0)}% de tus gastos`,d:`Un recorte del 10% en esta categoría ahorraría ${m$(top[1]*.1)} al mes.`})}
 if(ct.Suscripciones){pot+=ct.Suscripciones*.3;L.push({c:'Suscripciones',l:'m',t:'Revisa tus suscripciones',d:`Gastas ${m$(ct.Suscripciones)} al mes (${m$(ct.Suscripciones*12)} al año). Cancela las que no uses.`})}
 Object.keys(ct).forEach(k=>{if(pt[k]>0&&ct[k]>pt[k]*1.2&&ct[k]>100)L.push({c:k,l:'m',t:`${k} subió ${((ct[k]/pt[k]-1)*100).toFixed(0)}% vs. el mes anterior`,d:`Pasó de ${m$(pt[k])} a ${m$(ct[k])}. Verifica si fue un gasto puntual.`})});
 const proj=(c.exp+c.pend)/dd*dim;
 if(c.inc>0)L.push(proj>c.inc?{l:'h',t:'Proyección de déficit a fin de mes',d:`Con el ritmo actual gastarás ${m$(proj)} frente a ingresos de ${m$(c.inc)}.`}:{l:'l',t:'Ritmo de gasto sostenible',d:`Proyección de gasto a fin de mes: ${m$(proj)}, dentro de tus ingresos.`});
 if(c.pend>0)L.push({l:'m',t:`Tienes ${m$(c.pend)} por cobrar`,d:'Recuperar este dinero mejora directamente tu ahorro. Da seguimiento a los pagos pendientes.'});
 const rem=S.goal-c.sav;if(rem>0&&dim>dd)L.push({l:'i',t:'Meta de ahorro del mes',d:`Faltan ${m$(rem)}; equivale a ahorrar ${m$(rem/(dim-dd))} diarios hasta fin de mes.`});
 return{L,pot}}
// ===== Navegación por niveles: cada clic abre un nivel más con su explicación =====
let ST=[],INS=[];
const oc=(k,p)=>`onclick="nv('${k}',${JSON.stringify(p).replace(/"/g,'&quot;')})"`;
const nv=(k,p)=>{ST.push({k,p});render();scrollTo(0,0)},back=()=>{ST.pop();render()};
const pk=k=>{const[y,m]=k.split('-'),d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const pc=(a,b)=>b?(a/b*100).toFixed(0)+'%':'—';
const lk=(k,p,t,s,a)=>`<div class="row link" ${oc(k,p)}><div class="n"><b>${t}</b><small>${s||''}</small></div><div class="a">${a||''} ›</div></div>`;
const ex=t=>`<div class="ins i"><p style="margin:0;opacity:.95;font-size:14px">${t}</p></div>`;
const TIPS={Restaurantes:'Cocinar en casa un par de veces más por semana recorta este gasto de forma notable.',Suscripciones:'Cancela las que no hayas usado en el último mes.',Transporte:'Compara rutas, comparte viaje o usa transporte público cuando puedas.',Comida:'Haz lista de súper y compra por semana para evitar compras impulsivas.',Ocio:'Fija un tope mensual y úsalo primero en lo que más disfrutas.',Ropa:'Espera 48 horas antes de comprar para evitar compras impulsivas.',Servicios:'Revisa tus planes de internet y telefonía: cambiar de plan suele ahorrar.',Salud:'La prevención y los genéricos suelen reducir costos.',Viajes:'Reserva con anticipación y compara fechas flexibles.'};
const srt=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
const V={
 seg(n){const c=calc(),a=mon(),v={Ingresos:c.inc,Gastos:c.exp,Ahorro:c.sav,'Por cobrar':c.pend}[n];
  const T={Ingresos:'Todo el dinero que recibiste este mes: sueldo, trabajos extra y otros pagos.',Gastos:'Tus gastos reales del mes. No incluye el dinero que pagaste por otros y te deben.',Ahorro:`Lo que realmente te queda: Ingresos (${m$(c.inc)}) − Gastos (${m$(c.exp)}) − Por cobrar pendiente (${m$(c.pend)}). Tu meta es ${m$(S.goal)}.`,'Por cobrar':'Dinero que pagaste por otras personas y aún no te devuelven. Al marcarlo como devuelto deja de restar de tu ahorro.'}[n];
  let h=ex(`<b>${m$(v)}</b> · ${pc(v,c.inc)} de tus ingresos.<br>${T}`);
  if(n==='Gastos')h+=srt(cats(cur)).map(([k,x])=>lk('cat',{c:k},k,pc(x,c.exp)+' de tus gastos',m$(x))).join('');
  if(n==='Ingresos')h+=a.filter(m=>m.t==='in').map(m=>lk('mov',m.id,m.desc,m.date,m$(m.amt))).join('');
  if(n==='Por cobrar')h+=[...new Set(a.filter(m=>m.t==='owed').map(m=>m.who))].map(w=>{const x=a.filter(m=>m.t==='owed'&&m.who===w);return lk('person',w,w,x.length+' movimiento(s)',m$(sum(x.filter(m=>!m.paid))))}).join('');

const dcard=m=>`<div class="dc"><div class="t"><b>${TL[m.t]}</b><span>${m.date}</span></div><h3 class="link" ${oc('mov',m.id)}>${m.desc}</h3><div class="chips"><span class="chip">${m.t==='owed'?m.who+' · '+(m.paid?'Devuelto':'Pendiente'):m.cat}</span></div>
 <div class="f"><b>${sgn(m)}${m$(m.amt)}</b><span style="display:flex;gap:6px;align-items:center">${m.t==='in'?'':`<select class="mini" onchange="setCat(${m.id},this.value)">${CATS.map(k=>`<option ${k===m.cat?'selected':''}>${k}</option>`).join('')}</select>`}${m.t==='owed'?`<button onclick="toggle(${m.id})">${m.paid?'Pendiente':'Devuelto'}</button>`:''}<button onclick="del(${m.id})">Eliminar</button></span></div></div>`;
function hlist(){const q=norm(hf.q),a=M.filter(m=>m.date.slice(0,7)===hf.m&&(hf.t==='all'||m.t===hf.t)&&norm(m.desc+' '+m.cat+' '+(m.who||'')).includes(q)).sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);
 $('#hl').innerHTML=`<div class="lbl" style="margin:0 6px 10px">${a.length} movimientos · ${m$(sum(a))}</div>`+(a.map(dcard).join('')||'<div class="card dark">Sin resultados.</div>')}
function history(){const ms=[...new Set([cur,...M.map(m=>m.date.slice(0,7))])].sort().reverse();
 return`<div class="card dark"><input placeholder="Buscar por descripción, categoría o persona" value="${hf.q}" oninput="hf.q=this.value;hlist()"><div class="tabs" style="margin:8px 0">${[['all','Todo'],['in','Ingresos'],['out','Gastos'],['owed','Cobrar']].map(([k,n])=>`<button class="tab ${hf.t===k?'on':''}" onclick="hf.t='${k}';render()">${n}</button>`).join('')}</div><select onchange="hf.m=this.value;hlist()">${ms.map(k=>`<option value="${k}" ${k===hf.m?'selected':''}>${mname(k)}</option>`).join('')}</select></div><div id="hl"></div>`}
function account(){const u=U||{};return`<div class="card dark"><div class="sec">Mi perfil</div><input id="an" placeholder="Nombre completo" value="${u.name||S.name}"><input id="ae" type="email" placeholder="Correo electrónico" value="${u.email||''}"><input id="ap" type="tel" placeholder="Teléfono" value="${u.phone||''}"><select id="as">${['$','€','£','S/'].map(x=>`<option ${x===S.sym?'selected':''}>${x}</option>`).join('')}</select><input id="ag" type="number" inputmode="decimal" value="${S.goal}" placeholder="Meta mensual de ahorro"><div class="err" id="aerr"></div><button class="go" onclick="saveAcc()">Guardar cambios</button><button class="go alt" onclick="logout()">Cerrar sesión</button></div>
 <div class="card dark"><div class="sec">Tus datos</div><div class="lbl" style="font-size:14px;margin-bottom:8px">Se guardan en este navegador. Descarga un respaldo periódicamente.</div><button class="go" onclick="exportData()">Descargar respaldo</button><button class="go alt" onclick="$('#imp').click()">Restaurar respaldo</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"><button class="go alt" onclick="demo()">Cargar datos de ejemplo</button><button class="go alt" onclick="wipe()">Borrar todos los datos</button></div>`}
// ===== Acciones =====
const NAV=[['home','home','Inicio'],['capture','cap','Captura'],['analytics','ana','Analítica'],['history','his','Historial'],['invest','inv','Inversión'],['account','user','Cuenta']];
const SC={home,capture,analytics,history,invest,account};
function go(s){ST=[];screen=s;render();scrollTo(0,0)}
function render(){const t=ST[ST.length-1],v=t&&V[t.k](t.p);
 $('#app').innerHTML=`<header><div class="logo"><i></i>Nexora</div><button class="ib" onclick="go('account')">${S.name?S.name[0].toUpperCase():ic('user',20)}</button></header>`+(v?`<div class="crumb"><button onclick="back()">‹ Atrás</button><span>${ST.map(x=>V[x.k](x.p).t).join(' › ')}</span></div><div class="sec" style="font-size:22px"><b>${v.t}</b></div>${v.h}`:SC[screen]());
 $('#nav').innerHTML=NAV.map(([k,i,n])=>`<button class="nb ${!v&&k===screen?'on':''}" onclick="go('${k}')"><b>${ic(i)}</b>${n}</button>`).join('');
 if(!v&&screen==='capture')prev();if(!v&&screen==='history')hlist()}
const toggle=i=>{const m=M.find(x=>x.id===i);m.paid=!m.paid;persist();render()};
const del=i=>{if(confirm('¿Eliminar este movimiento?')){M=M.filter(x=>x.id!==i);if(ST.length&&ST[ST.length-1].k==='mov')ST.pop();persist();render()}};
const setCat=(i,v)=>{M.find(x=>x.id===i).cat=v;persist();render()};
function saveAcc(){const g=parseFloat($('#ag').value),e=$('#ae').value.trim(),p=$('#ap').value.trim(),n=$('#an').value.trim(),E=x=>$('#aerr').textContent=x;
 if(!n)return E('Escribe tu nombre');if(!/^\S+@\S+\.\S+$/.test(e))return E('Correo no válido');if(p.replace(/\D/g,'').length<10)return E('Teléfono no válido (mínimo 10 dígitos)');if(!(g>0))return E('La meta debe ser mayor a 0');
 U={...U,name:n,email:e,phone:p};S.name=n;S.sym=$('#as').value;S.goal=g;try{localStorage.setItem(AK,JSON.stringify(U))}catch(x){}persist();render()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({M,S,I})],{type:'application/json'}));a.download='nexora-respaldo-'+TD+'.json';a.click()}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.M))throw 0;M=d.M;I=d.I||[];Object.assign(S,d.S||{});id=[...M,...I].reduce((x,m)=>Math.max(x,m.id),0)+1;persist();render()}catch(e){alert('Archivo de respaldo no válido')}};r.readAsText(file)}
function demo(){if(M.length&&!confirm('Se agregarán datos de ejemplo a los tuyos. ¿Continuar?'))return;
 ['Sueldo 12000','Freelance 2500','Renta 4500','Supermercado 1850','Uber 320','Netflix 219','Spotify 129','Cine y cena 650','Farmacia 380','Zapatos 1200','Gasolina 700','Cena 480 me debe Carlos'].forEach(l=>{const q=parse(l);M.push({...q,id:id++,paid:false})});I.push({id:id++,name:'CETES a 6 meses',type:'CETES',start:addM(TD,-2),months:6,rate:10.5,dep:[{d:addM(TD,-2),a:5000}]});persist();go('home')}
function wipe(){if(confirm('Se borrarán TODOS tus movimientos. Esta acción no se puede deshacer.')){M=[];I=[];persist();render()}}
// ===== Formulario con categoría automática =====
function openForm(t){const L={in:'Nuevo ingreso',out:'Nuevo gasto',owed:'Dinero por cobrar'};
 $('#sheet').innerHTML=`<div class="sec"><b>${L[t]}</b><span onclick="closeForm()" style="font-size:22px">✕</span></div><input id="fa" type="number" inputmode="decimal" step="0.01" placeholder="Monto"><input id="fd" oninput="autoCat()" placeholder="${t==='in'?'Fuente (ej. Sueldo)':'Descripción (ej. Uber, Netflix)'}">
 ${t==='in'?'':`<select id="fc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><div class="hint" id="fh"></div>`}${t==='owed'?'<input id="fw" placeholder="¿Quién te debe?">':''}<input id="fdt" type="date" value="${TD}"><div class="err" id="ferr"></div><button class="go" onclick="save('${t}')">Guardar</button>`;$('#modal').classList.add('show')}
function autoCat(){const g=guess($('#fd').value),e=$('#fc');if(e){if(g){e.value=g;$('#fh').textContent='Categoría detectada: '+g}else $('#fh').textContent=''}}
const closeForm=()=>$('#modal').classList.remove('show');
function save(t){const amt=parseFloat($('#fa').value),desc=$('#fd').value.trim(),date=$('#fdt').value,who=t==='owed'?$('#fw').value.trim():'',E=x=>$('#ferr').textContent=x;
 if(!(amt>0))return E('El monto debe ser mayor a 0');if(!desc)return E('Escribe una descripción');if(t==='owed'&&!who)return E('Indica quién te debe');if(!date)return E('Elige una fecha');
 M.push({id:id++,t,amt,desc:cap(desc),date,cat:t==='in'?'Ingreso':$('#fc').value,who,paid:false});persist();closeForm();hf.m=date.slice(0,7);render()}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeForm()});
boot();
</script>
</body>
</html>
